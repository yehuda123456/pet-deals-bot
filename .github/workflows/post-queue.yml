name: post-queue

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours, one deal per run
  workflow_dispatch:         # manual run button

permissions:
  contents: write            # lets the job update queue.txt and posted.txt

concurrency:
  group: post-queue
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python post_queue.py --max 1
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save queue changes
        run: |
          git config user.name "deals-bot"
          git config user.email "deals-bot@users.noreply.github.com"
          git add queue.txt posted.txt
          git diff --cached --quiet || (git commit -m "update queue" && git pull --rebase && git push)
